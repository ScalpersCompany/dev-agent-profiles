name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s profiles/odoo11/tests -v
      - name: Shell syntax
        run: bash -n profiles/odoo11/guard/odoo.sh
      - name: Python syntax
        run: python3 -m py_compile profiles/odoo11/guard/odoo_lint.py
